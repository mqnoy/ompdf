services:
  app:
    build:
      context: ../..
      dockerfile: apps/docker-app/Dockerfile
    image: ompdf-system-dependency-proof:local
    ports:
      - "${OMPDF_PORT:-3000}:3000"
    environment:
      PORT: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  verify:
    build:
      context: ../..
      dockerfile: apps/docker-app/Dockerfile
    image: ompdf-system-dependency-proof:local
    command: ["node", "verify.mjs"]
    profiles: ["verify"]
